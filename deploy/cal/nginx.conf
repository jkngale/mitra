server {
    listen 80;
    listen [::]:80;
    server_name cal.joaquingale.es;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 301 https://cal.joaquingale.es$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cal.joaquingale.es;
    ssl_certificate /etc/letsencrypt/live/cal.joaquingale.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cal.joaquingale.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    auth_basic 'Mitra - private';
    auth_basic_user_file /etc/nginx/.htpasswd-cal;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_set_header Authorization '';
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
